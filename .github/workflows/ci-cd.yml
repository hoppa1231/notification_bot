name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: notification-bot-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to moscow
    runs-on: ubuntu-latest
    needs: test
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      DEPLOY_PATH: /opt/notification_bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload application
        run: |
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='.pytest_cache' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            -czf - . | ssh "$SSH_USER@$SSH_HOST" "tar -xzf - -C '$DEPLOY_PATH'"

      - name: Write production env
        run: |
          test -n "$PROD_ENV_FILE"
          printf '%s\n' "$PROD_ENV_FILE" | ssh "$SSH_USER@$SSH_HOST" "cat > '$DEPLOY_PATH/.env'"

      - name: Restart service
        run: |
          ssh "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && docker-compose up -d --build --remove-orphans && docker-compose ps"

      - name: Health check
        run: |
          ssh "$SSH_USER@$SSH_HOST" "curl -fsS http://127.0.0.1:2005/health"

      - name: Notify deployment
        env:
          NOTIFY_API_URL: ${{ secrets.NOTIFY_API_URL }}
          NOTIFY_API_TOKEN: ${{ secrets.NOTIFY_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual deployment' }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_API_URL" ] || [ -z "$NOTIFY_API_TOKEN" ]; then
            echo "Deployment notification skipped: NOTIFY_API_URL or NOTIFY_API_TOKEN is not configured."
            exit 0
          fi

          python - <<'PY' > /tmp/deploy-notification.json
          import json
          import os

          sha = os.environ["COMMIT_SHA"]
          payload = {
              "type": "info",
              "title": "Deployment completed",
              "message": "\n".join(
                  [
                      f"Commit: {sha[:7]}",
                      f"Author: {os.environ['COMMIT_AUTHOR']}",
                      f"Message: {os.environ['COMMIT_MESSAGE']}",
                      f"Run: {os.environ['RUN_URL']}",
                  ]
              ),
              "source": "github-actions",
          }
          print(json.dumps(payload))
          PY
          curl -fsS \
            -X POST "$NOTIFY_API_URL" \
            -H "Authorization: Bearer $NOTIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/deploy-notification.json
